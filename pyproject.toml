[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "news-extractor"
version = "0.2.0"
description = "Dependency-free, SSRF-aware Turkish news article extraction library and CLI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Okan Erturan", email = "okanert@gmail.com" }]
keywords = ["news", "scraping", "turkey", "articles", "json-ld", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.scripts]
news-extractor = "news_extractor.cli:main"

[project.urls]
Homepage = "https://github.com/okturan/news-extractor"
Repository = "https://github.com/okturan/news-extractor"
Issues = "https://github.com/okturan/news-extractor/issues"
Research = "https://github.com/okturan/news-extractor/blob/master/RESEARCH.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
