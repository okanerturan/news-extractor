[tool.poetry]
name = "news-extractor"
version = "0.1.0"
description = "Two-tier Turkish news article extractor with Newspaper4k primary and Trafilatura fallback."
authors = ["Okan Erturan <okanert@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/okturan/news-extractor"
keywords = ["news", "scraping", "turkey", "articles", "extraction"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing :: Linguistic"
]
packages = [{ include = "news_extractor", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
newspaper4k = "0.9.3.1"
trafilatura = "^2.0.0"
requests = "^2.31.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"

[tool.poetry.scripts]
news-extractor = "news_extractor.cli:main"

[build-system]
requires = ["poetry-core>=2.2.1"]
build-backend = "poetry.core.masonry.api"
