name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project without dependencies
        run: python -m pip install --no-deps --editable .
      - name: Verify environment
        run: python -m pip check
      - name: Run deterministic unit suite
        run: python -m unittest discover -s tests/unit -v
      - name: Reproduce versioned extraction-quality benchmark
        run: python scripts/run_quality_benchmark.py --format markdown --check benchmarks/results/corpus-v1-v0.2.0.md
      - name: Compile active Python sources
        run: python -m compileall -q src tests/unit tests/validation examples scripts
      - name: Exercise CLI entry point
        run: news-extractor --help

  package:
    name: Build and inspect package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned build frontend
        run: python -m pip install build==1.3.0
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify package metadata has no runtime requirements
        run: python scripts/verify_distribution.py dist
      - name: Install wheel in a clean virtual environment
        run: |
          python -m venv /tmp/news-extractor-package
          /tmp/news-extractor-package/bin/python -m pip install --no-deps dist/*.whl
          /tmp/news-extractor-package/bin/python -m pip check
          /tmp/news-extractor-package/bin/news-extractor --help
          /tmp/news-extractor-package/bin/python -c "import news_extractor; assert news_extractor.__version__ == '0.2.0'"
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: news-extractor-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
